# 受 Git 跟踪的默认模板。真实 Key 只能填写在本机 providers.toml 中。
# 缺少本机文件时程序读取此模板；在托盘编辑 Provider 时自动创建本机副本。
# 官方模型：https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash-lite
# 官方接口：https://ai.google.dev/gemini-api/docs/openai
[providers.gemini]
kind = "openai" # 协议类型；请求发往下列 Google 地址
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.5-flash-lite"
api_key = "" # 仅在 providers.toml 的此处填写 Google AI Studio Key
timeout = 30
# 可改用环境变量：取消下行注释。显式指定后优先读取环境变量。
# api_key_env = "GEMINI_API_KEY"

[providers.local]
kind = "ollama"
base_url = "http://127.0.0.1:11434"
model = "gemma3:4b"
timeout = 30
