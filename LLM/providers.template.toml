# Git-tracked defaults. Store real keys only in local providers.toml or the environment.
# Read this template if the local file is absent; tray editing creates a local copy.
# Model documentation: https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash-lite
# API documentation: https://ai.google.dev/gemini-api/docs/openai
[providers.gemini]
kind = "openai" # Protocol type; requests go to the Google endpoint below.
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.5-flash-lite"
api_key = "" # Set the Google AI Studio key only in local providers.toml.
timeout = 30
# Uncomment below to prefer an explicit environment variable over api_key.
# api_key_env = "GEMINI_API_KEY"

[providers.local]
kind = "ollama"
base_url = "http://127.0.0.1:11434"
model = "gemma3:4b"
timeout = 30
