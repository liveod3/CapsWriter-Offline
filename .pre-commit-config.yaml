repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check --force-exclude
        language: system
        types: [python]
      - id: mypy-critical-paths
        name: mypy (critical pure Python modules)
        entry: >-
          python -m mypy core/protocol.py core/server/schema.py
          core/server/merger
          core/tools/format_tools.py
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest-unit
        name: pytest (fast unit tests)
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: compileall
        name: compileall
        entry: >-
          python -m compileall -q start_client.py start_server.py
          config_templates core LLM tests scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: internal-language
        name: Internal language policy
        entry: python scripts/check_internal_language.py
        language: system
        pass_filenames: false
        always_run: true
      - id: documentation
        name: Documentation links and structure
        entry: python scripts/check_docs.py
        language: system
        pass_filenames: false
        files: '\.md$|^scripts/check_docs\.py$'
