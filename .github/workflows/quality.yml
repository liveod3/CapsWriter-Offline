name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-client.txt
            requirements-server.txt
            requirements-dev.txt

      - name: Install dependencies
        run: >-
          python -m pip install
          -r requirements-client.txt
          -r requirements-server.txt
          -r requirements-dev.txt

      - name: Initialize default configuration
        shell: pwsh
        run: |
          if (!(Test-Path config_client.py)) { Copy-Item config_templates/config_client_template.py config_client.py }
          if (!(Test-Path config_server.py)) { Copy-Item config_templates/config_server_template.py config_server.py }

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          start_client.py start_server.py config_client.py config_server.py config_templates core LLM

      - name: Lint
        run: python -m ruff check start_client.py start_server.py config_client.py config_server.py config_templates core LLM tests

      - name: Type-check critical paths
        run: >-
          python -m mypy core/protocol.py core/server/schema.py
          core/server/merger
          core/tools/format_tools.py

      - name: Run unit tests with coverage
        run: >-
          python -m pytest
          --cov
          --cov-report=term-missing
          --cov-fail-under=50
