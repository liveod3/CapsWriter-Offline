name: Release smoke

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  package-smoke:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-client.txt
            requirements-server.txt

      - name: Install runtime dependencies
        run: >-
          python -m pip install
          -r requirements-client.txt
          -r requirements-server.txt

      - name: Build combined package
        run: python -m PyInstaller --clean --noconfirm build.spec

      - name: Verify package entry points
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "dist\CapsWriter-Offline"
          $expected = @("start_client.exe", "start_server.exe")
          foreach ($entryPoint in $expected) {
            $target = Join-Path $releaseDir $entryPoint
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "Missing build entry point: $target"
            }
          }
